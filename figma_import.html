<!DOCTYPE html>
<html lang="en" data-theme="theme-modal-soul">
<head>
    <meta charset="UTF-8">
    <title>Nujabes Figma Mockup</title>
    <style>
        :root {
            --bg: #E6CFA1;
            --text: #1A1A1A;
            --accent: #D97941;
            --accent-dark: #8C4F2B;
            --font: 'Georgia', serif;
        }
        body { margin: 0; background: #eee; font-family: var(--font); }
        .canvas-mock { width: 1440px; margin: 50px auto; background: var(--bg); color: var(--text); padding-bottom: 100px; }
        .page { height: 1024px; position: relative; border-bottom: 2px dashed #000; overflow: hidden; display: flex; flex-direction: column; }

        header { height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 80px; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .logo { font-weight: bold; letter-spacing: 10px; font-size: 20px; }
        nav ul { display: flex; gap: 40px; list-style: none; text-transform: uppercase; font-size: 12px; letter-spacing: 2px; }

        /* Page 1: Home */
        .p1-content { display: flex; align-items: center; justify-content: center; flex: 1; flex-direction: column; gap: 40px; }
        .hologram-placeholder { width: 400px; height: 400px; border: 1px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
        .hologram-placeholder::after { content: "3D CANVAS"; color: var(--accent); font-size: 10px; letter-spacing: 5px; }
        .player { width: 400px; padding: 20px; border: 1px solid var(--text); display: flex; align-items: center; gap: 20px; border-radius: 40px; }
        .play-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; }

        /* Page 2: Discography */
        .p2-content { padding: 80px; }
        .slider-mock { width: 100%; height: 500px; background: rgba(0,0,0,0.05); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; letter-spacing: 20px; color: var(--accent); }
        .track-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 40px; }
        .track-card { height: 100px; border: 1px solid rgba(0,0,0,0.1); padding: 20px; display: flex; align-items: center; gap: 15px; }
        .track-img { width: 60px; height: 60px; background: var(--accent-dark); }

        /* Page 3: Access */
        .p3-content { display: grid; grid-template-columns: 1fr 1fr; gap: 100px; padding: 100px 80px; align-items: center; }
        .form-area { padding: 60px; border: 1px solid var(--text); }
        .form-input { width: 100%; padding: 15px; border: 1px solid var(--text); background: transparent; margin-bottom: 20px; }
        .morph-btn { width: 100%; height: 60px; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; border: none; font-weight: bold; letter-spacing: 5px; }
        .mascot-area { height: 400px; border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="canvas-mock">
        <!-- PAGE 1 -->
        <section class="page">
            <header>
                <div class="logo">NUJABES</div>
                <nav><ul><li>Modal</li><li>Soul</li><li>Access</li></ul></nav>
            </header>
            <div class="p1-content">
                <div class="hologram-placeholder"></div>
                <h1 style="font-size: 60px; letter-spacing: 20px; font-weight: 300;">MODAL SOUL</h1>
                <div class="player">
                    <div class="play-btn">▶</div>
                    <div>
                        <div style="font-weight: bold; font-size: 14px;">Feather (Instrumental)</div>
                        <div style="font-size: 10px; opacity: 0.6;">Eternal Lo-Fi Ambience</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- PAGE 2 -->
        <section class="page">
            <div class="p2-content">
                <h2 style="letter-spacing: 15px; text-align: center; margin-bottom: 40px;">DISCOGRAPHY</h2>
                <div class="slider-mock">METAPHORICAL MUSIC</div>
                <div class="track-grid">
                    <div class="track-card"><div class="track-img"></div><div>Blessing It</div></div>
                    <div class="track-card"><div class="track-img"></div><div>Horn In The Middle</div></div>
                    <div class="track-card"><div class="track-img"></div><div>Lady Brown</div></div>
                    <div class="track-card"><div class="track-img"></div><div>Beat Laments the World</div></div>
                </div>
            </div>
        </section>

        <!-- PAGE 3 -->
        <section class="page">
            <div class="p3-content">
                <div class="form-area">
                    <h3 style="letter-spacing: 5px;">RESERVE VINYL</h3>
                    <div class="form-input">Email Address</div>
                    <div class="form-input">Credit Card Number</div>
                    <div class="form-input">Secret Access Key</div>
                    <button class="morph-btn">INITIALIZE ORDER</button>
                </div>
                <div class="mascot-area">
                    <div style="text-align: center;">
                        <svg width="200" height="200" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="40" fill="none" stroke="black"/>
                            <path d="M 30 40 Q 40 30 50 40" stroke="black" fill="none"/>
                            <path d="M 50 40 Q 60 30 70 40" stroke="black" fill="none"/>
                        </svg>
                        <p style="font-size: 10px; letter-spacing: 3px; margin-top: 20px;">SAMURAI MASCOT</p>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
